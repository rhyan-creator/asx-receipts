<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASX Database</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='8' width='3' height='6' rx='1' fill='%232a78d6'/><rect x='6.5' y='5' width='3' height='9' rx='1' fill='%232a78d6'/><rect x='11' y='2' width='3' height='12' rx='1' fill='%232a78d6'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --border: #e4e3df;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
  --accent: #2a78d6; --accent-soft: #e8f1fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #6250d6;
  --pos: #1baf7a; --neg: #e34948; --warn-bg: #fff6e0; --warn: #8a5a00;
  --grid: rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2b;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8a8984;
    --accent: #3987e5; --accent-soft: #1c2b3f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9;
    --pos: #199e70; --neg: #e66767; --warn-bg: #2e2412; --warn: #e8b85a;
    --grid: rgba(255,255,255,.08);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; cursor: pointer; }
.sub { color: var(--muted); font-size: 13px; }
.search { position: relative; margin: 20px 0 8px; }
.search input { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.suggest { position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin-top: 4px; list-style: none; padding: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); display: none; }
.suggest li { padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; }
.suggest li.on, .suggest li:hover { background: var(--accent-soft); }
.suggest b { min-width: 48px; }
.suggest span { color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest i { font-style: normal; font-size: 12px; color: var(--muted); }
.title { margin: 28px 0 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.title .name { color: var(--text-2); }
.title .px { margin-left: auto; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.views { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 14px 0 4px; }
.views button { font: inherit; font-size: 15px; font-weight: 500; border: 0; background: none; color: var(--text-2);
  padding: 8px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.views button.on { color: var(--text); border-color: var(--accent); }
.controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--text-2); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.seg button:disabled { opacity: .35; cursor: default; }
.chips2 { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
.chips2 button { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chips2 button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.chips2 button:disabled { opacity: .35; cursor: default; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.d.up { color: var(--pos); } .d.down { color: var(--neg); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.chart { position: relative; height: 380px; }
.chart.small { height: 180px; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 12px 0; }
.banner a { color: inherit; font-weight: 600; }
.tabs { display: flex; gap: 4px; margin: 20px 0 8px; }
.tabs button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--text-2); padding: 6px 10px; border-bottom: 2px solid transparent; cursor: pointer; }
.tabs button.on { color: var(--text); border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
td.r, th.r { text-align: right; }
.scroll { max-height: 460px; overflow: auto; }
.scroll:has(table.fin) { max-height: none; }
.fin th:first-child, .fin td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.fin th:first-child { z-index: 2; }
.fin td.lab { color: var(--text); font-weight: 500; }
.fin tr.pct td { color: var(--text-2); }
.fin tr.sep td { border-top: 2px solid var(--border); }
.fin td.cell { cursor: default; }
.fin td.cell.link { cursor: pointer; }
.fin td.cell.link:hover { background: var(--accent-soft); }
.mk { font-size: 10px; margin-left: 3px; vertical-align: super; }
.mk.ok { color: var(--pos); } .mk.bad { color: var(--warn); }
.fin td.odd { color: var(--warn); font-weight: 500; }
.mk.cmp { color: var(--muted); }
a { color: var(--accent); }
.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; margin-top: 10px; }
.empty { text-align: center; color: var(--text-2); padding: 60px 16px; }
.empty .chips { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.hidden { display: none !important; }
.custom { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); }
.custom select, .pricebox input[type=number] { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; transition: background .15s; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 16px; }
.push { margin-left: auto; }
.rangeinfo { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
.stale { background: var(--accent-soft); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 0 0 12px; }
.stale button { font: inherit; font-size: 13px; border: 0; background: var(--accent); color: #fff; border-radius: 7px; padding: 4px 10px; margin-left: 8px; cursor: pointer; }
.nodata { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-2); font-size: 14px; text-align: center; padding: 0 16px; }
.pricebox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--text-2); }
.pricebox input[type=number] { width: 110px; font-variant-numeric: tabular-nums; }
.pricebox .reset { font: inherit; font-size: 13px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin: -2px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { height: 0; border-top: 2px dashed var(--muted); background: none !important; }
.legend i.dot { height: 0; border-top: 2px dotted var(--muted); background: none !important; }
@media (max-width: 720px) {
  .push { margin-left: 0; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .chart { height: 300px; }
  .tile .v { font-size: 20px; }
  .title .px { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ASX Database</h1>
    <div class="sub" id="coverage">Loading company list…</div>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Type a ticker or company name, e.g. LGI">
    <ul class="suggest" id="suggest"></ul>
  </div>

  <div id="home" class="empty">
    Receipts, financials and valuation multiples for ASX companies, read from their 4C, half-year and annual reports.
    <div class="chips" id="chips"></div>
  </div>

  <section id="view" class="hidden">
    <div class="title"><h2 id="tk"></h2><span class="name" id="nm"></span><span class="pill" id="sector"></span><span class="px" id="pxline"></span></div>
    <div id="banner"></div>
    <div id="body">
      <div class="views" id="views">
        <button data-v="receipts">Receipts</button><button data-v="fin">Financials</button><button data-v="val">Valuation</button>
      </div>
      <div class="controls">
        <div class="seg" id="freq">
          <button data-v="Quarterly">Quarterly</button><button data-v="Half-yearly">Half-yearly</button>
          <button data-v="Annual">Annual</button><button data-v="TTM">TTM</button>
        </div>
        <div class="seg" id="range">
          <button data-v="3">3y</button><button data-v="5">5y</button><button data-v="10">10y</button>
          <button data-v="all">All</button><button data-v="custom">Custom</button>
        </div>
        <div class="custom hidden" id="customBox">
          <label for="from">From</label><select id="from"></select>
          <label for="to">to</label><select id="to"></select>
        </div>
        <label class="switch push"><input type="checkbox" id="showVals"> Show values</label>
      </div>
      <div class="rangeinfo" id="rangeInfo"></div>
      <div id="stale"></div>

      <!-- valuation-only controls -->
      <div class="card hidden" id="valControls">
        <div class="pricebox">
          <label for="price">Share price</label>
          <input id="price" type="number" step="0.001" min="0" inputmode="decimal">
          <span id="priceNote"></span>
          <button class="reset hidden" id="priceReset">Use last close</button>
          <label class="switch push"><input type="checkbox" id="leases"> Count lease liabilities as debt</label>
        </div>
      </div>

      <div class="chips2 hidden" id="metrics"></div>
      <div class="tiles" id="tiles"></div>
      <div class="card" id="mainCard"><h3 id="chartTitle"></h3><div class="legend hidden" id="legend"></div>
        <div class="chart"><canvas id="main"></canvas><div class="nodata hidden" id="noData"></div></div>
        <div class="note" id="mainNote"></div></div>
      <div class="card" id="growthCard"><h3 id="growthTitle">Growth vs the same period a year earlier</h3>
        <div class="chart small"><canvas id="growth"></canvas></div></div>
      <div class="card hidden" id="avgCard"><h3 id="avgTitle">Average multiples</h3><div class="scroll"><table id="avgTable"></table></div>
        <div class="note" id="avgNote"></div></div>
      <div class="tabs" id="tabs"><button data-v="data" class="on">Data</button><button data-v="docs">Source filings</button></div>
      <div class="card" id="tab-data"><div class="scroll"><table id="dataTable"></table></div>
        <button class="btn" id="csv">Download CSV</button><div class="note" id="dataNote"></div></div>
      <div class="card hidden" id="tab-docs"><div class="scroll"><table id="docTable"></table></div></div>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const state = {
  companies: [], byCode: {}, data: null, view: "receipts", freq: "Quarterly", range: "10", from: null, to: null,
  metric: "revenue", mult: "pe", charts: {}, showVals: store.get("showVals", false), leases: store.get("leases", true),
  price: {},
};
const FREQS = ["Quarterly", "Half-yearly", "Annual", "TTM"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const SYM = { AUD: "A$", USD: "US$", NZD: "NZ$", CAD: "C$", GBP: "£" };
const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const mdiff = (a, b) => { const [ay, am] = a.split("-").map(Number), [by, bm] = b.split("-").map(Number); return (by - ay) * 12 + (bm - am); };
const addM = (e, n) => { const [y, m] = e.split("-").map(Number); const t = y * 12 + m - 1 + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, "0")}`; };
const fmtYM = e => { const [y, m] = e.split("-").map(Number); return MON[m - 1] + "-" + String(y).slice(2); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const asxLink = id => `https://www.asx.com.au/asx/v2/statistics/displayAnnouncement.do?display=pdf&idsId=${id}`;
// growth off a tiny base (e.g. a company's first revenue) is mathematically right but meaningless
const NM_LIMIT = 5;
const CONV_LO = 0.6, CONV_HI = 1.8;  // receipts ÷ revenue outside this range gets a "?" in the table  // above +500% (or off a zero/negative base) we show "n.m." instead
function markNM(rows) {
  // n.m. when growth tops +500%, or when the year-earlier figure was under 2% of the series' largest value
  const max = Math.max(0, ...(rows || []).map(r => Math.abs(r.v || 0)));
  (rows || []).forEach(r => {
    if (r.yoy == null) return;
    const prior = r.v / (1 + r.yoy);
    if (Math.abs(r.yoy) > NM_LIMIT || Math.abs(prior) < 0.02 * max) { r.nm = true; r.yoy = null; }
  });
  return rows;
}
const yoyText = (r, suffix = "") => r.nm ? "n.m." : r.yoy != null ? pct(r.yoy) + suffix : "";
const pct = (v, dp = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(dp) + "%";
const pctPlain = (v, dp = 1) => v == null || !isFinite(v) ? "–" : (v * 100).toFixed(dp) + "%";
const xf = v => v == null || !isFinite(v) ? "–" : v.toFixed(1) + "x";
const ccy = () => (state.data && state.data.currencies && state.data.currencies.length === 1) ? state.data.currencies[0] : "AUD";
function money(v, c = ccy()) {
  if (v == null || !isFinite(v)) return "–";
  const s = SYM[c] || c + " ", a = Math.abs(v), sign = v < 0 ? "−" : "";
  if (a >= 1e9) return sign + s + (a / 1e9).toFixed(2) + "b";
  if (a >= 1e6) return sign + s + (a / 1e6).toFixed(1) + "m";
  if (a >= 1e3) return sign + s + (a / 1e3).toFixed(0) + "k";
  return sign + s + a.toFixed(0);
}
function actionsUrl() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  return m && repo ? `https://github.com/${m[1]}/${repo}/actions/workflows/update.yml` : null;
}

// ---------------------------------------------------------- metric definitions
const FLOWS = { revenue: "Revenue", gross: "Gross profit", ebitda: "EBITDA", ebit: "EBIT", npat: "Net income" };
const STOCKS = { cash: "Cash", debt: "Debt", netdebt: "Net debt", shares: "Shares outstanding" };
const FIN_METRICS = ["revenue", "gross", "ebitda", "ebit", "npat", "margins", "cash", "debt", "netdebt", "shares"];
const LABEL = { ...FLOWS, ...STOCKS, margins: "Margins" };
const MULTS = {
  pe: { label: "P/E", num: "mc", den: "npat", denLabel: "net income" },
  ev_ebitda: { label: "EV/EBITDA", num: "ev", den: "ebitda", denLabel: "EBITDA" },
  ev_ebit: { label: "EV/EBIT", num: "ev", den: "ebit", denLabel: "EBIT" },
  ev_sales: { label: "EV/Sales", num: "ev", den: "revenue", denLabel: "revenue" },
  ev_receipts: { label: "EV/Receipts", num: "ev", den: "receipts", denLabel: "receipts" },
};

// ---------------------------------------------------------- data access
const D = () => state.data;
const fye = () => {
  const a = (D().fin && D().fin.revenue && D().fin.revenue.Annual) || D().series.Annual || [];
  return a.length ? Number(a[a.length - 1].end.split("-")[1]) : 6;
};
function flowRows(metric, freq) {
  if (metric === "receipts") return D().series[freq] || [];
  return (D().fin && D().fin[metric] && D().fin[metric][freq]) || [];
}
function stockRowsRaw(metric) {
  const b = D().bal || {};
  if (metric === "netdebt") {
    const cash = Object.fromEntries((b.cash || []).map(r => [r.end, r]));
    const debt = b.debt || [], lease = Object.fromEntries((b.leases || []).map(r => [r.end, r]));
    return debt.filter(r => cash[r.end]).map(r => ({ ...r, v: r.v + (state.leases && lease[r.end] ? lease[r.end].v : 0) - cash[r.end].v,
      basis: "debt" + (state.leases ? " + leases" : "") + " − cash", chk: null }));
  }
  if (metric === "debt" && state.leases) {
    const lease = Object.fromEntries((b.leases || []).map(r => [r.end, r]));
    return (b.debt || []).map(r => ({ ...r, v: r.v + (lease[r.end] ? lease[r.end].v : 0), basis: "borrowings + leases" }));
  }
  return b[metric] || [];
}
function stockRows(metric, freq) {
  const f = fye(), half = ((f + 6 - 1) % 12) + 1;
  let rows = stockRowsRaw(metric).filter(r => {
    const m = Number(r.end.split("-")[1]);
    if (freq === "Annual") return m === f;
    if (freq === "Half-yearly") return m === f || m === half;
    return true;
  });
  const by = Object.fromEntries(rows.map(r => [r.end, r.v]));
  return markNM(rows.map(r => ({ ...r, label: freq === "Annual" ? `FY${r.end.slice(2, 4)}` : r.label,
    yoy: by[addM(r.end, -12)] > 0 ? r.v / by[addM(r.end, -12)] - 1 : null })));
}
function metricRows(metric, freq) {
  if (metric in STOCKS) return stockRows(metric, freq);
  return flowRows(metric, freq);
}
function hasMetric(m) {
  if (m === "margins") return hasMetric("revenue") && (hasMetric("ebitda") || hasMetric("ebit") || hasMetric("npat"));
  if (m === "netdebt") return (D().bal || {}).debt && (D().bal || {}).cash;
  if (m in STOCKS) return !!((D().bal || {})[m] || []).length;
  return ["Half-yearly", "Annual", "TTM"].some(f => flowRows(m, f).length);
}
const hasFin = () => FIN_METRICS.some(hasMetric);

// ---------------------------------------------------------- range
function inRange(rows) {
  if (!rows.length || state.range === "all") return rows;
  if (state.range === "custom") return rows.filter(r => (!state.from || r.end >= state.from) && (!state.to || r.end <= state.to));
  const now = new Date();
  const cut = ym(new Date(now.getFullYear() - Number(state.range), now.getMonth(), 1));
  return rows.filter(r => r.end > cut);
}
function fillCustom(all) {
  const opts = all.map(r => `<option value="${r.end}">${esc(r.label)}</option>`).join("");
  $("#from").innerHTML = opts; $("#to").innerHTML = opts;
  if (!all.length) return;
  $("#from").value = (all.find(r => r.end >= (state.from || all[0].end)) || all[0]).end;
  $("#to").value = ([...all].reverse().find(r => r.end <= (state.to || "9999-12")) || all[all.length - 1]).end;
}

// ---------------------------------------------------------- company list + search
async function init() {
  try {
    const r = await fetch("data/index.json", { cache: "no-cache" });
    const idx = await r.json();
    state.companies = idx.companies.map(([t, n, s, st]) => ({ t, n, s, st }));
    state.companies.forEach(c => state.byCode[c.t] = c);
    const ready = state.companies.filter(c => c.st === "ready").length;
    const done = state.companies.filter(c => c.st !== "queued").length;
    $("#coverage").textContent = `${ready.toLocaleString()} companies with data · ` +
      (done < state.companies.length ? `history ${Math.round(100 * done / state.companies.length)}% loaded · ` : "") +
      `updated ${idx.updated}`;
  } catch (e) {
    $("#coverage").textContent = "No data yet: the first update hasn't finished.";
  }
  showChips();
  if (location.hash.length > 1) load(location.hash.slice(1));
}
function showChips() {
  const recent = store.get("recent", []);
  $("#chips").innerHTML = recent.map(t => `<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => load(b.dataset.t));
}
let sel = -1;
function suggest() {
  const q = $("#q").value.trim().toUpperCase(), box = $("#suggest");
  if (!q) { box.style.display = "none"; return; }
  const starts = state.companies.filter(c => c.t.startsWith(q));
  const names = state.companies.filter(c => !c.t.startsWith(q) && c.n.toUpperCase().includes(q));
  const list = [...starts.sort((a, b) => a.t.length - b.t.length), ...names].slice(0, 8);
  sel = list.length ? 0 : -1;
  box.innerHTML = list.map((c, i) => `<li data-t="${c.t}" class="${i === 0 ? "on" : ""}"><b>${c.t}</b><span>${esc(c.n)}</span>` +
    `<i>${c.st === "ready" ? "" : c.st === "none" ? "no data found" : c.st === "error" ? "couldn't load" : "loading soon"}</i></li>`).join("");
  box.style.display = list.length ? "block" : "none";
  box.querySelectorAll("li").forEach(li => li.onmousedown = () => load(li.dataset.t));
}
$("#q").addEventListener("input", suggest);
$("#q").addEventListener("keydown", e => {
  const items = [...$("#suggest").querySelectorAll("li")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((li, i) => li.classList.toggle("on", i === sel));
  } else if (e.key === "Enter") {
    const t = items[sel] ? items[sel].dataset.t : $("#q").value.trim().toUpperCase();

  } else if (e.key === "Escape") $("#suggest").style.display = "none";
});

// ---------------------------------------------------------- load a ticker
async function load(t) {
  t = t.toUpperCase().replace(/\.AX$/, "");
  $("#q").value = ""; $("#suggest").style.display = "none";
  history.replaceState(null, "", "#" + t);
  const c = state.byCode[t];
  $("#home").classList.add("hidden"); $("#view").classList.remove("hidden");
  $("#tk").textContent = t; $("#nm").textContent = c ? c.n : "";
  const sec = c && c.s && c.s !== "Not Applic" ? c.s : "";
  $("#sector").textContent = sec; $("#sector").classList.toggle("hidden", !sec);
  $("#banner").innerHTML = ""; $("#pxline").textContent = "";
  let data = null;
  try { const r = await fetch(`data/${t}.json`, { cache: "no-cache" }); if (r.ok) data = await r.json(); } catch (e) {}
  state.data = data;
  if (data) {
    Object.values(data.series || {}).forEach(markNM);
    Object.values(data.fin || {}).forEach(m => Object.values(m).forEach(markNM));
  }
  const hasReceipts = data && FREQS.some(f => (data.series || {})[f] && data.series[f].length);
  if (data) { data.series = data.series || {}; FREQS.forEach(f => data.series[f] = data.series[f] || []); }
  if (!data || (!hasReceipts && !hasFin() && !(data.prices))) {
    $("#body").classList.add("hidden");
    const a = actionsUrl();
    let msg;
    if (!c) msg = `<b>${esc(t)}</b> isn't on the current ASX company list. Check the ticker.`;
    else if (!data || c.st === "queued") msg = `<b>${esc(t)}</b> hasn't been loaded yet. The updater works through the whole ASX ` +
      `over the first few days.` + (a ? ` To load it now: <a href="${a}" target="_blank" rel="noopener">open the updater</a>, ` +
      `click <b>Run workflow</b>, type <b>${esc(t)}</b> and press the green button. It's ready in about 5 minutes.` : "");
    else msg = `Nothing could be read from ${esc(t)}'s filings yet. You can add figures in <b>overrides.csv</b> in the repository.`;
    $("#banner").innerHTML = `<div class="banner">${msg}</div>`;
    if (data && data.docs && data.docs.length) { $("#body").classList.remove("hidden"); onlyDocs(); }
    return;
  }
  $("#body").classList.remove("hidden");
  ["#views", ".controls", "#tiles", "#mainCard", "#tabs"].forEach(s => $(s).classList.remove("hidden"));
  const recent = store.get("recent", []).filter(x => x !== t);
  store.set("recent", [t, ...recent].slice(0, 8));
  // view availability
  $("#views [data-v=receipts]").disabled = !hasReceipts;
  $("#views [data-v=fin]").disabled = !hasFin();
  $("#views [data-v=val]").disabled = !(data.prices && data.prices.monthly && data.prices.monthly.length);
  if (state.view === "receipts" && !hasReceipts) state.view = hasFin() ? "fin" : "val";
  if (state.view === "fin" && !hasFin()) state.view = hasReceipts ? "receipts" : "val";
  const hasPrices = !!(data.prices && data.prices.monthly && data.prices.monthly.length);
  if (state.view === "val" && !hasPrices) state.view = hasReceipts ? "receipts" : "fin";
  if (!hasMetric(state.metric)) state.metric = FIN_METRICS.find(hasMetric) || "revenue";
  if (state.range === "custom") state.range = "10";
  // receipts: start on the most up-to-date frequency
  if (hasReceipts) {
    const last = f => { const s = data.series[f]; return s.length ? s[s.length - 1].end : null; };
    const latest = ["Quarterly", "Half-yearly", "Annual"].map(last).filter(Boolean).sort().pop();
    const fresh = f => last(f) && mdiff(last(f), latest) < 6;
    state.rfreq = ["Quarterly", "Half-yearly", "Annual", "TTM"].find(fresh) || FREQS.find(f => data.series[f].length);
  }
  if (!state.ffreq) state.ffreq = "Annual";
  const px = data.prices && data.prices.last;
  if (px) $("#pxline").textContent = `Last close ${(SYM[ccy()] || "")}${px.close.toFixed(px.close < 1 ? 3 : 2)} · ${px.date}`;
  if (data.currencies && data.currencies.length > 1) $("#banner").innerHTML = `<div class="banner">This company has reported in more than one currency ` +
    `(${data.currencies.join(", ")}). Figures are shown as reported, without FX conversion.</div>`;
  render();
}

// ---------------------------------------------------------- chart helpers
const valueLabels = {
  id: "valueLabels",
  afterDatasetsDraw(chart, _a, o) {
    if (!o || !o.display) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = "500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif";
    ctx.fillStyle = css("--text-2");
    chart.data.datasets.forEach((ds, di) => {
      if (ds.noLabels) return;
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden || !meta.data.length) return;
      const texts = ds.data.map(v => v == null ? "" : o.fmt(v));
      const slot = chart.chartArea.width / meta.data.length;
      const widest = Math.max(...texts.map(t => ctx.measureText(t).width));
      const rotate = ds.type !== "line" && chart.config.type !== "line" && widest > slot - 2;
      meta.data.forEach((el, i) => {
        const v = ds.data[i]; if (v == null || (o.only && !o.only(i))) return;
        const neg = v < 0, t = texts[i];
        ctx.save();
        if (rotate) {
          ctx.translate(el.x, neg ? el.y + 4 : el.y - 4); ctx.rotate(-Math.PI / 2);
          ctx.textAlign = neg ? "right" : "left"; ctx.textBaseline = "middle"; ctx.fillText(t, 0, 0);
        } else {
          ctx.textAlign = "center"; ctx.textBaseline = neg ? "top" : "bottom";
          ctx.fillText(t, el.x, neg ? el.y + 5 : el.y - 5);
        }
        ctx.restore();
      });
    });
    ctx.restore();
  },
};
function baseOpts(unitLabel) {

        borderColor: css("--border"), borderWidth: 1, padding: 10, displayColors: false } },
    scales: {
      x: { grid: { display: false }, ticks: { color: tc, maxRotation: 45, autoSkip: true, autoSkipPadding: 8 }, border: { color: grid } },
      y: { grid: { color: grid }, border: { display: false }, ticks: { color: tc }, title: { display: !!unitLabel, text: unitLabel, color: tc } },

function kill(k) { if (state.charts[k]) { state.charts[k].destroy(); state.charts[k] = null; } }
function scaleFor(vals) {

const tile = (k, v, dl, cls = "") => `<div class="tile"><div class="k" title="${esc(k)}">${k}</div><div class="v">${v}</div><div class="d ${cls}">${dl || "&nbsp;"}</div></div>`;

// ----- receipts view

    f !== "Quarterly" && (state.metric === "margins" ? flowRows("revenue", f).length : flowRows(state.metric, f).length);

  $("#metrics").querySelectorAll("button").forEach(b => b.onclick = () => { state.metric = b.dataset.m; render(); });
  if (state.metric === "margins") return renderMargins(freq);

  if (state.range === "custom") fillCustom(all);
  const rs = inRange(all);

  const name = LABEL[state.metric] + (state.metric === "debt" && state.leases ? " (incl. leases)" : "");
  if (!rs.length) { $("#tiles").innerHTML = ""; noData(`No ${name.toLowerCase()} figures in this date range.`); finTable(freq); return; }
  showCanvas();
  const lr = rs[rs.length - 1];

  const yrs = first ? mdiff(first.end, lr.end) / 12 : 0;
  const cg = first && lr.v > 0 && yrs >= 1 ? Math.pow(lr.v / first.v, 1 / yrs) - 1 : null;
  const skipped = first && rs.indexOf(first) > 0 && rs.slice(0, rs.indexOf(first)).some(r => r.v < 0.1 * lr.v);
  const signed = state.metric === "netdebt" || rs.some(r => r.v < 0);
  const prevYr = rs.find(r => r.end === addM(lr.end, -12));
  const chg = (a, b) => (a - b >= 0 ? "+" : "−") + money(Math.abs(a - b));
  const t1 = signed ? (prevYr ? `${chg(lr.v, prevYr.v)} vs a year earlier` : "") : yoyText(lr, " YoY");
  const t1cls = signed ? (prevYr ? dir((state.metric === "netdebt" ? -1 : 1) * (lr.v - prevYr.v)) : "") : isShares ? "" : dir(lr.yoy);
  let t3;
  if (state.metric === "revenue") {
    const rc = flowRows("receipts", freq).find(r => r.end === lr.end);
    t3 = tile(`Receipts ÷ revenue · ${lr.label}`, rc && lr.v ? pctPlain(rc.v / lr.v) : "–", "cash collected vs revenue booked (receipts include GST)");
  } else if (state.metric in FLOWS) t3 = tile(`Margin · ${lr.label}`, marginAt(state.metric, freq, lr.end), "of revenue");
  else t3 = tile("As at", lr.label, lr.src ? esc(lr.src.slice(0, 40)) : "");
  $("#tiles").innerHTML =
    tile(`${name} · ${lr.label}`, fmt(lr.v), t1, t1cls) +
    (signed ? tile("Change over range", rs.length > 1 ? chg(lr.v, rs[0].v) : "–", rs.length > 1 ? `${rs[0].label} to ${lr.label}` : "")
      : tile(`Growth per year`, cg != null ? pctPlain(cg) : "–", cg != null ? `compound, ${first.label} to ${lr.label}` + (skipped ? " (earlier periods too small to compare)" : "") : "not enough comparable periods")) +
    t3 +
    (state.metric === "netdebt" ? tile("Built from", "Cash & debt", "each checked separately in the table below")
      : (() => {
          const reported = rs.filter(r => r.basis === "reported");
          const derived = rs.length - reported.length;
          const checkable = reported.filter(r => r.chk).length;
          const diffs = rs.filter(r => r.chk === "differs").map(r => r.label);
          const sub = [diffs.length ? `differs: ${diffs.join(", ")}` : (checkable ? "all checkable figures match" : "nothing to check yet"),
            derived ? `${derived} derived` : "", reported.length - checkable ? `${reported.length - checkable} not yet checkable` : ""].filter(Boolean).join(" · ");

        })());
  if (isShares) {

// ----- financial summary table (periods across, metrics down)
function finTable(freq) {
  const f = freq === "Quarterly" ? "Half-yearly" : freq;
  const rev = flowRows("revenue", f);
  const endsAll = [...new Set([...rev.map(r => r.end), ...["ebitda", "npat"].flatMap(m => flowRows(m, f).map(r => r.end))])].sort();
  const ends = inRange(endsAll.map(e => ({ end: e }))).map(r => r.end);
  const flowBy = m => Object.fromEntries(flowRows(m, f).map(r => [r.end, r]));
  const stockBy = m => Object.fromEntries(stockRowsRaw(m).map(r => [r.end, r]));
  const lab = e => (flowRows("revenue", f).find(r => r.end === e) || {}).label || fmtYM(e);
  const R = { receipts: flowBy("receipts"), revenue: flowBy("revenue"), gross: flowBy("gross"), ebitda: flowBy("ebitda"),
    ebit: flowBy("ebit"), npat: flowBy("npat"), cash: stockBy("cash"), debt: stockBy("debt"), netdebt: stockBy("netdebt"), shares: stockBy("shares") };
  const rawDebt = Object.fromEntries(((D().bal || {}).debt || []).map(r => [r.end, r]));
  const lease = Object.fromEntries(((D().bal || {}).leases || []).map(r => [r.end, r]));
  const allV = ends.flatMap(e => [R.revenue[e], R.receipts[e]].filter(Boolean).map(r => r.v));
  const div = Math.max(0, ...allV.map(Math.abs)) >= 5e6 ? 1e6 : 1e3, unit = div === 1e6 ? "m" : "k";
  const num = v => v == null ? "–" : (v / div).toLocaleString("en-AU", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const cell = (r, text) => {
    if (!r) return `<td class="r cell">–</td>`;
    const mk = r.chk === "verified" ? `<span class="mk ok">✓</span>` : r.chk === "differs" ? `<span class="mk bad">!</span>` :
      String(r.basis).startsWith("from next") ? `<span class="mk cmp">c</span>` : "";
    const t = [basisText(r.basis),
      r.src, r.rel ? "released " + r.rel : "", r.chk === "verified" ? "✓ matches next report" : r.chk === "differs" ? "! next report differs" : ""].filter(Boolean).join(" · ");
    return `<td class="r cell${r.doc ? " link" : ""}" ${r.doc ? `data-doc="${r.doc}"` : ""} title="${esc(t)}">${text}${mk}</td>`;
  };
  const rowsDef = [
    ["Revenue", "revenue"], ["Receipts from customers", "receipts"], ["Gross profit", "gross"], ["EBITDA", "ebitda"], ["EBIT", "ebit"], ["Net income", "npat"],
    ["sep"], ["Gross margin", "gross", "pct"], ["EBITDA margin", "ebitda", "pct"], ["EBIT margin", "ebit", "pct"], ["Net margin", "npat", "pct"],
    ["Receipts ÷ revenue", "receipts", "conv"],
    ["sep"], ["Cash", "cash"], ["Borrowings", "rawdebt"], ["Lease liabilities", "lease"], ["Net debt" + (state.leases ? " (incl. leases)" : ""), "netdebt"], ["Shares (m)", "shares"],
  ];
  let html = `<thead><tr><th>${SYM[ccy()] || ""}${unit}</th>${ends.map(e => `<th class="r">${esc(lab(e))}</th>`).join("")}</tr></thead><tbody>`;
  let sep = false;
  for (const def of rowsDef) {
    if (def[0] === "sep") { sep = true; continue; }
    const [name, key, kind] = def;
    let cells, any = false;
    if (kind === "conv") {
      // cash collected vs revenue booked. Receipts include GST, so ~100–115% is normal; far outside
      // that usually means one of the two figures was misread (or a big working-capital swing)
      cells = ends.map(e => {
        const a = R.receipts[e], b = R.revenue[e];
        if (!(a && b && b.v)) return `<td class="r">–</td>`;
        any = true;
        const r = a.v / b.v, odd = r < CONV_LO || r > CONV_HI;
        return `<td class="r${odd ? " odd" : ""}" title="${odd ? "Unusual: check revenue and receipts for this period" : "Receipts (incl. GST) ÷ revenue"}">${pctPlain(r, 0)}${odd ? `<span class="mk bad">?</span>` : ""}</td>`;
      });
    } else if (kind === "pct") {
      cells = ends.map(e => { const a = R[key][e], b = R.revenue[e]; if (a && b && b.v) { any = true; return `<td class="r">${pctPlain(a.v / b.v)}</td>`; } return `<td class="r">–</td>`; });
    } else {
      const src = key === "rawdebt" ? rawDebt : key === "lease" ? lease : R[key];
      cells = ends.map(e => { const r = src[e]; if (r) any = true; return cell(r, r ? (key === "shares" ? (r.v / 1e6).toFixed(1) : num(r.v)) : "–"); });
    }
    if (!any) continue;
    html += `<tr class="${kind === "pct" ? "pct" : ""} ${sep ? "sep" : ""}"><td class="lab">${name}</td>${cells.join("")}</tr>`;
    sep = false;
  }
  $("#dataTable").innerHTML = ends.length ? html + "</tbody>" : `<tbody><tr><td>No figures in this date range.</td></tr></tbody>`;
  $("#dataTable").classList.add("fin");
  $("#dataTable").querySelectorAll("td.link").forEach(td => td.onclick = () => window.open(asxLink(td.dataset.doc), "_blank", "noopener"));
  $("#dataNote").innerHTML = `Periods: ${f.toLowerCase()} · <span class="mk ok">✓</span> = matches the comparative in the next report · ` +
    `<span class="mk bad">!</span> = the next report shows a different number (often a restatement) · ` +
    `<span class="mk cmp">c</span> = taken from the next report's comparative column · ` +
    `<span class="mk bad">?</span> = receipts and revenue are far apart (normally 100–115% because receipts include GST), so check that period. Click a figure to open its filing.`;
  state.csv = () => {
    const rows = [["metric", ...ends.map(lab)]];
    for (const [name, key, kind] of rowsDef.filter(d => d[0] !== "sep")) {
      const src = key === "rawdebt" ? rawDebt : key === "lease" ? lease : R[key];
      rows.push([name, ...ends.map(e => kind === "conv" ? (R.receipts[e] && R.revenue[e] && R.revenue[e].v ? (R.receipts[e].v / R.revenue[e].v).toFixed(4) : "") : kind === "pct" ? (R[key][e] && R.revenue[e] && R.revenue[e].v ? (R[key][e].v / R.revenue[e].v).toFixed(4) : "") : (src[e] ? src[e].v : ""))]);
    }
    return { name: `${D().ticker}_financials_${f.toLowerCase()}.csv`, rows };
  };
}

function availAt(rows, monthEnd) {
  // latest row whose period ended and whose filing was public by monthEnd (no hindsight)
  let best = null;
  for (const r of rows) {
    if (r.end > monthEnd.slice(0, 7)) continue;
    const rel = r.rel || (addM(r.end, 2) + "-28");
    if (rel <= monthEnd && (!best || r.end >= best.end)) best = r;
  }
  return best;
}
function inputsAt(monthEnd, asOf) {
  const d = D(), ttm = m => m === "receipts" ? d.series.TTM : flowRows(m, "TTM");
  const ref = (asOf || monthEnd).slice(0, 7);
  const out = {};
  for (const m of ["revenue", "ebitda", "ebit", "npat", "receipts"]) {
    const r = availAt(ttm(m) || [], monthEnd);
    out[m] = r && mdiff(r.end, ref) <= 15 ? r : null;
  }
  const b = d.bal || {};
  for (const m of ["cash", "debt", "leases", "shares"]) {
    const r = availAt(b[m] || [], monthEnd);
    out[m] = r && mdiff(r.end, ref) <= 15 ? r : null;
  }
  return out;
}

  const ev = inp.cash || inp.debt ? mc + debt - (inp.cash ? inp.cash.v : 0) : null;
  const res = { price, shares: sh, mc, ev, debt, cash: inp.cash ? inp.cash.v : null };
  for (const [k, def] of Object.entries(MULTS)) {
    const top = def.num === "mc" ? mc : ev, den = inp[def.den];
    res[k] = top != null && den && den.v > 0 ? top / den.v : null;
  }
  return res;
}
function monthlyMultiples() {

}

// ---------------------------------------------------------- controls
document.querySelectorAll("#views button").forEach(b => b.onclick = () => { if (!b.disabled) { state.view = b.dataset.v; render(); } });
document.querySelectorAll("#freq button").forEach(b => b.onclick = () => {
  if (b.disabled) return;
  if (state.view === "receipts") state.rfreq = b.dataset.v; else state.ffreq = b.dataset.v;
  render();
});
document.querySelectorAll("#range button").forEach(b => b.onclick = () => {
  if (b.dataset.v === "custom" && state.range !== "custom") {
    // start the custom range from what's on screen now
    const rows = state.view === "val" ? monthlyMultiples() : state.view === "receipts" ? D().series[state.rfreq]
      : metricRows(state.metric === "margins" ? "revenue" : state.metric, state.ffreq);
    const cur = inRange(rows || []);
    state.from = cur.length ? cur[0].end : null; state.to = cur.length ? cur[cur.length - 1].end : null;
  }
  state.range = b.dataset.v; render();
});
$("#from").onchange = () => { state.from = $("#from").value; if (state.to && state.from > state.to) state.to = state.from; render(); };
$("#to").onchange = () => { state.to = $("#to").value; if (state.from && state.to < state.from) state.from = state.to; render(); };
$("#showVals").onchange = () => { state.showVals = $("#showVals").checked; store.set("showVals", state.showVals); render(); };
$("#leases").onchange = () => { state.leases = $("#leases").checked; store.set("leases", state.leases); render(); };
$("#price").oninput = () => {
  const v = parseFloat($("#price").value);
  if (v > 0) { state.price[D().ticker] = v; render(); }
};
$("#priceReset").onclick = () => { delete state.price[D().ticker]; $("#price").value = ""; render(); };
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.v));
$("#csv").onclick = () => {
  if (!state.csv) return;
  const { name, rows } = state.csv();
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" }));
  a.download = name; a.click();
};
$("h1").onclick = () => { history.replaceState(null, "", location.pathname); $("#view").classList.add("hidden"); $("#home").classList.remove("hidden"); showChips(); };
window.addEventListener("hashchange", () => location.hash.length > 1 && load(location.hash.slice(1)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.data && render());
init();
</script>
</body>
</html>
